<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダムK-POPグループ</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f6eaff,#eaf6ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24213a;padding:20px}
main{width:min(100%,480px);background:#fff;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 16px 50px #41366a20}
.kicker{font-size:13px;letter-spacing:.12em;color:#80769b} h1{font-size:27px;margin:8px 0 20px} .group{min-height:110px;display:grid;place-items:center;font-size:clamp(25px,7vw,38px);font-weight:800;overflow-wrap:anywhere}
button{border:0;border-radius:16px;background:#6b4eff;color:white;font-size:17px;font-weight:700;padding:16px 22px;width:100%;margin-top:14px;cursor:pointer} button:active{transform:scale(.98)}
a{display:inline-block;margin-top:18px;color:#5e45d6;font-weight:600;text-decoration:none} .note{font-size:12px;color:#8b879b;margin-top:20px;line-height:1.6}
</style>
</head>
<body><main>
<div class="kicker">K-POP RANDOM PICK</div>
<h1>今日のK-POPグループは？</h1>
<div class="group" id="name">ボタンを押して抽選！</div>
<button id="pick">ランダムで選ぶ</button>
<a id="wiki" href="#" target="_blank" rel="noopener" hidden>日本語版Wikipediaで見る ↗</a>
<div class="note">毎回ランダムに抽選します。直前に出たグループは続けて出にくい仕様です。<br>収録グループ：70組</div>
</main>
<script>
const groups = [["BTS", "BTS"], ["SEVENTEEN", "SEVENTEEN"], ["Stray Kids", "Stray Kids"], ["TOMORROW X TOGETHER", "TOMORROW X TOGETHER"], ["ENHYPEN", "ENHYPEN"], ["ATEEZ", "ATEEZ"], ["NCT", "NCT"], ["NCT 127", "NCT 127"], ["NCT DREAM", "NCT DREAM"], ["RIIZE", "RIIZE"], ["EXO", "EXO"], ["SHINee", "SHINee"], ["BIGBANG", "BIGBANG"], ["Super Junior", "SUPER JUNIOR"], ["TVXQ", "東方神起"], ["GOT7", "GOT7"], ["MONSTA X", "MONSTA X"], ["THE BOYZ", "THE BOYZ"], ["TREASURE", "TREASURE"], ["ZEROBASEONE", "ZEROBASEONE"], ["BOYNEXTDOOR", "BOYNEXTDOOR"], ["TWS", "TWS"], ["BTOB", "BTOB"], ["INFINITE", "INFINITE"], ["2PM", "2PM"], ["HIGHLIGHT", "HIGHLIGHT"], ["IVE", "IVE"], ["BLACKPINK", "BLACKPINK"], ["TWICE", "TWICE"], ["LE SSERAFIM", "LE SSERAFIM"], ["aespa", "aespa"], ["NewJeans", "NewJeans"], ["ITZY", "ITZY"], ["Red Velvet", "Red Velvet"], ["少女時代", "少女時代"], ["KARA", "KARA"], ["Wonder Girls", "Wonder Girls"], ["2NE1", "2NE1"], ["MAMAMOO", "MAMAMOO"], ["GFRIEND", "GFRIEND"], ["fromis_9", "fromis_9"], ["STAYC", "STAYC"], ["NMIXX", "NMIXX"], ["Kep1er", "Kep1er"], ["BABYMONSTER", "BABYMONSTER"], ["ILLIT", "ILLIT"], ["Hearts2Hearts", "Hearts2Hearts"], ["KISS OF LIFE", "KISS OF LIFE"], ["tripleS", "tripleS"], ["FIFTY FIFTY", "FIFTY FIFTY"], ["OH MY GIRL", "OH MY GIRL"], ["WJSN", "宇宙少女"], ["LOONA", "今月の少女"], ["Apink", "Apink"], ["EXID", "EXID"], ["SISTAR", "SISTAR"], ["T-ARA", "T-ARA"], ["f(x)", "f(x)"], ["iKON", "iKON"], ["WINNER", "WINNER"], ["B.A.P", "B.A.P"], ["Block B", "Block B"], ["PENTAGON", "PENTAGON"], ["CRAVITY", "CRAVITY"], ["ONEUS", "ONEUS"], ["Xdinary Heroes", "Xdinary Heroes"], ["DAY6", "DAY6"], ["CNBLUE", "CNBLUE"], ["FTISland", "FTISLAND"], ["AKMU", "AKMU"]];
let previous = -1;
const name = document.getElementById('name'), wiki = document.getElementById('wiki');
document.getElementById('pick').addEventListener('click', () => {
  let idx;
  do { idx = Math.floor(Math.random() * groups.length); } while (groups.length > 1 && idx === previous);
  previous = idx;
  const [display, title] = groups[idx];
  name.textContent = display;
  wiki.href = 'https://ja.wikipedia.org/wiki/' + encodeURIComponent(title).replace(/%20/g, '_');
  wiki.hidden = false;
});
</script></body></html>
